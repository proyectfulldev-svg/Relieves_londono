spring.application.name=relieves-londono
# Secretos locales (JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD) en secretos.properties, en la raiz del proyecto.
# Ese archivo esta en .gitignore: nunca se sube a git. Ver secretos.properties.example.
spring.config.import=optional:file:./secretos.properties
# --- Conexion a SQL Server local ---
# trustServerCertificate=true: el SQL Server local usa un certificado autofirmado (solo para desarrollo).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=relieves_londono;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
# --- JPA / Hibernate ---
# Las tablas las crea Flyway; Hibernate solo valida que las entidades coincidan con la base de datos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Los textos de las entidades se mapean a NVARCHAR (como en las migraciones); sin esto, validate falla.
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# --- Seguridad / JWT ---
# JWT_SECRET viene de secretos.properties o de una variable de entorno (minimo 32 caracteres).
jwt.secret=${JWT_SECRET}
jwt.expiracion=8h
# Administrador inicial: solo se usa si la tabla usuarios esta vacia.
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
