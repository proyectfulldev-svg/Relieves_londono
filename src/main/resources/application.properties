spring.application.name=relieves-londono
# --- Conexion a SQL Server local ---
# trustServerCertificate=true: el SQL Server local usa un certificado autofirmado (solo para desarrollo).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=relieves_londono;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
# La contrasena se lee de la variable de entorno DB_PASSWORD; nunca se escribe aqui.
spring.datasource.password=12345
# --- JPA / Hibernate ---
# Las tablas las crea Flyway; Hibernate solo valida que las entidades coincidan con la base de datos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
